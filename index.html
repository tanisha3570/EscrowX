  const [tab, setTab] = useState("overview");
  const released = p.milestones.filter((m) => m.status === "Paid").reduce((s, m) => s + m.amount, 0);
  const secured = p.total - released;

  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.muted, fontSize: 12.5, marginBottom: 12, display: "flex", alignItems: "center", gap: 4 }}>&larr; Back</button>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
        <div>
          <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 26, margin: "0 0 6px" }}>{p.title}</h1>
          <div style={{ color: C.muted, fontSize: 13 }}>{p.client} → {p.freelancer} · Due {p.deadline}</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {(p.assignmentStatus || "Accepted") === "Pending" && <Chip tone="gold"><Clock size={12} /> Awaiting Acceptance</Chip>}
          {p.assignmentStatus === "Declined" && <Chip tone="red"><X size={12} /> Declined</Chip>}
          <RiskBadge risk={p.riskScore} />
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 18, borderBottom: `1px solid ${C.borderSoft}`, flexWrap: "wrap" }}>
        {["overview", "milestones", "agreement", "activity"].map((t) => (
          <button key={t} onClick={() => setTab(t)} style={{ background: "none", border: "none", borderBottom: tab === t ? `2px solid ${C.gold}` : "2px solid transparent", color: tab === t ? C.text : C.muted, padding: "9px 4px", fontSize: 13, fontWeight: 600, textTransform: "capitalize", marginRight: 14 }}>{t}</button>
        ))}
      </div>

      {tab === "overview" && (
        <div>
          {(p.assignmentStatus || "Accepted") === "Pending" ? (
            <Card style={{ marginBottom: 18, textAlign: "center", padding: 30 }}>
              {role === "freelancer" ? (
                <>
                  <UserCircle2 size={22} color={C.gold} style={{ marginBottom: 10 }} />
                  <div style={{ fontWeight: 700, marginBottom: 6 }}>{p.client} wants to assign you this project</div>
                  <div style={{ color: C.muted, fontSize: 13, marginBottom: 16 }}>Review the milestones and total value below, then accept or decline. Nothing moves into escrow until you accept.</div>
                  <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                    <Btn variant="green" onClick={onAcceptAssignment}><CheckCircle2 size={14} /> Accept Project</Btn>
                    <Btn variant="danger" onClick={onDeclineAssignment}><X size={14} /> Decline</Btn>
                  </div>
                </>
              ) : (
                <>
                  <Clock size={22} color={C.gold} style={{ marginBottom: 10 }} />
                  <div style={{ fontWeight: 700, marginBottom: 6 }}>Awaiting freelancer response</div>
                  <div style={{ color: C.muted, fontSize: 13 }}>{p.freelancer} has been notified of this assignment. The smart agreement and escrow deposit unlock once they accept.</div>
                </>
              )}
            </Card>
          ) : p.assignmentStatus === "Declined" ? (
            <Card style={{ marginBottom: 18, textAlign: "center", padding: 30, border: `1px solid rgba(232,97,91,.3)`, background: "rgba(232,97,91,.06)" }}>
              <AlertTriangle size={22} color={C.red} style={{ marginBottom: 10 }} />
              <div style={{ fontWeight: 700, marginBottom: 6, color: C.red }}>Project declined</div>
              <div style={{ color: C.muted, fontSize: 13 }}>
                {role === "client"
                  ? `${p.freelancer} declined this assignment. Create a new project to assign it to a different freelancer.`
                  : `You declined this assignment. The client has been notified.`}
              </div>
            </Card>
          ) : !p.escrow?.deposited ? (
            <Card style={{ marginBottom: 18, textAlign: "center", padding: 30 }}>
              {!p.agreement ? (
                <>
                  <Sparkles size={22} color={C.gold} style={{ marginBottom: 10 }} />
                  <div style={{ fontWeight: 700, marginBottom: 6 }}>No agreement yet</div>
                  <div style={{ color: C.muted, fontSize: 13, marginBottom: 16 }}>Generate a structured smart agreement before funding escrow.</div>
                  <Btn onClick={onGenerateAgreement} disabled={p.agreementLoading}>{p.agreementLoading ? <><Loader2 size={14} /> Drafting…</> : <>Generate Smart Agreement with AI <Sparkles size={14} /></>}</Btn>
                </>
              ) : role === "client" ? (
                <>
                  <Lock size={22} color={C.gold} style={{ marginBottom: 10 }} />
                  <div style={{ fontWeight: 700, marginBottom: 6 }}>Escrow Amount: {money(p.total)}</div>
                  <div style={{ color: C.muted, fontSize: 13, marginBottom: 16 }}>Agreement accepted. Deposit funds to lock them in escrow.</div>
                  <Btn onClick={onDeposit} disabled={p.depositLoading}>{p.depositLoading ? <><Loader2 size={14} /> Processing…</> : <><Wallet size={14} /> Deposit to Escrow</>}</Btn>
                </>
              ) : (
                <div style={{ color: C.muted, fontSize: 13 }}>Waiting on client to fund escrow.</div>
              )}
            </Card>
          ) : (
            <Card style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, color: C.green, fontWeight: 700 }}><CheckCircle2 size={16} /> Funds secured in escrow</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 10, marginBottom: 12, fontSize: 12.5 }}>
                <div><div style={{ color: C.faint }}>Amount</div><div style={{ fontWeight: 600 }}>{money(p.escrow.amount)}</div></div>
                <div><div style={{ color: C.faint }} title="A unique reference number for this deposit, like an order number.">Escrow ID</div><div style={{ fontFamily: FONT_MONO }}>{p.escrow.escrowId}</div></div>
                <div><div style={{ color: C.faint }}>Status</div><div title="Simulated for this demo — no real funds moved.">{p.escrow.txStatus}</div></div>
                <div><div style={{ color: C.faint }}>Timestamp</div><div>{p.escrow.timestamp}</div></div>
              </div>
              <ChainReceipt label="Demo Transaction · Escrow Deposit" hash={p.escrow.walletAddress} wallet={shortAddr(p.escrow.walletAddress)} network={p.escrow.network} />
            </Card>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 18 }}>
            <StatCard label="Paid to Freelancer" value={money(released)} sub="Released from escrow — done" tone={C.green} icon={Unlock} />
            <StatCard label="Still Locked in Escrow" value={money(secured)} sub="Not paid out yet" tone={C.gold} icon={Lock} />
            <StatCard label="Total Project Value" value={money(p.total)} />
          </div>
          <div style={{ width: "100%", height: 8, background: C.surface2, borderRadius: 6, overflow: "hidden", marginBottom: 6 }}>
            <div style={{ width: `${(released / p.total) * 100}%`, height: "100%", background: C.green }} />
          </div>
          <div style={{ fontSize: 11.5, color: C.faint, marginBottom: 20 }}>{money(released)} of {money(p.total)} paid out to freelancer so far</div>

          <RiskPanel risk={p.riskScore} />
        </div>
      )}

      {tab === "milestones" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {p.milestones.map((m, i) => (
            <MilestoneCard key={m.id} m={m} index={i} role={role} project={p}
              onSubmit={(d) => onSubmitDeliverable(m.id, d)} onAnalyze={() => onAnalyze(m.id)}
              onApprove={() => onApprove(m.id)} onRevision={() => onRevision(m.id)}
              onDispute={(c, f) => onDispute(m.id, c, f)} onResolveDispute={onResolveDispute} />
          ))}
        </div>
      )}

      {tab === "agreement" && (
        <Card>
          {p.agreement ? (
            <>
              <pre style={{ whiteSpace: "pre-wrap", fontFamily: FONT_BODY, fontSize: 13, lineHeight: 1.7, color: C.text, margin: 0 }}>{p.agreement}</pre>
              {p.refundRules?.length > 0 && (
                <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${C.borderSoft}` }}>
                  <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>Smart Refund Rules</div>
                  {p.refundRules.map((r) => <div key={r} style={{ fontSize: 12.5, color: C.muted, marginBottom: 4 }}>• {r}</div>)}
                </div>
              )}
            </>
          ) : <div style={{ color: C.faint, fontSize: 13 }}>No agreement generated yet.</div>}
        </Card>
      )}

      {tab === "activity" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
          {p.activity.slice().reverse().map((a, i) => (
            <div key={i} style={{ display: "flex", gap: 12, padding: "10px 0", borderBottom: `1px solid ${C.borderSoft}` }}>
              <div style={{ width: 7, height: 7, borderRadius: "50%", background: C.gold, marginTop: 5, flexShrink: 0 }} />
              <div>
                <div style={{ fontSize: 13, color: C.text }}>{a.text}</div>
                <div style={{ fontSize: 11, color: C.faint }}>{a.date}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================== MILESTONE CARD ============================== */
function MilestoneCard({ m, index, role, project, onSubmit, onAnalyze, onApprove, onRevision, onDispute, onResolveDispute }) {
  const [expanded, setExpanded] = useState(false);
  const [showSubmit, setShowSubmit] = useState(false);
  const [showDispute, setShowDispute] = useState(false);
  const dispute = project.disputes.find((d) => d.milestoneId === m.id && d.status === "Open");

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setExpanded((e) => !e)}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontFamily: FONT_MONO, color: C.faint, fontSize: 12 }}>{index + 1}</span>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14.5 }}>{m.name}</div>
            <div style={{ color: (m.status === "Paid" && role === "freelancer") ? C.green : C.muted, fontSize: 12, fontWeight: (m.status === "Paid" && role === "freelancer") ? 600 : 400 }}>
              {m.status === "Paid" && role === "freelancer" ? `✓ ${money(m.amount)} received` : `${money(m.amount)} · due ${m.deadline}`}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <Stamp status={m.status} role={role} />
          {expanded ? <ChevronDown size={16} color={C.faint} /> : <ChevronRight size={16} color={C.faint} />}
        </div>
      </div>

      {expanded && (
        <div className="fade-up" style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.borderSoft}` }}>
          <div style={{ color: C.muted, fontSize: 13, marginBottom: 14, lineHeight: 1.5 }}>{m.description}</div>

          {role === "freelancer" && m.status === "Paid" && (
            <div style={{ background: "rgba(63,191,143,.08)", border: `1px solid rgba(63,191,143,.3)`, borderRadius: 10, padding: 14, marginBottom: 14, display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: "50%", background: "rgba(63,191,143,.18)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Unlock size={16} color={C.green} />
              </div>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14, color: C.green }}>Payment Received: {money(m.amount)}</div>
                <div style={{ fontSize: 11.5, color: C.faint }}>{m.paidAt ? `Released to your wallet on ${m.paidAt}` : "Released to your wallet"} · from escrow</div>
              </div>
            </div>
          )}

          {m.deliverable && (
            <div style={{ background: C.bgAlt, borderRadius: 10, padding: 12, marginBottom: 12, fontSize: 12.5 }}>
              <div style={{ color: C.faint, marginBottom: 4 }}>Submitted deliverable ({m.deliverable.type})</div>
              <div style={{ color: C.text }}>{m.deliverable.content}</div>
            </div>
          )}

          {m.analyzing && <div style={{ display: "flex", alignItems: "center", gap: 8, color: C.gold, fontSize: 13, marginBottom: 12 }}><Loader2 size={14} /> Analyzing deliverable with AI…</div>}

          {m.aiAnalysis && (
            <div style={{ background: "rgba(201,162,39,.06)", border: `1px solid rgba(201,162,39,.25)`, borderRadius: 10, padding: 14, marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 700, fontSize: 13, marginBottom: 10, color: C.goldSoft }}><Sparkles size={13} /> Deliverable Analysis</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 10 }}>
                {m.aiAnalysis.checks.map((c, i) => (
                  <div key={i} style={{ fontSize: 12.5, display: "flex", gap: 7, alignItems: "flex-start" }}>
                    <span>{c.pass === true ? "✓" : c.pass === "warn" ? "⚠" : "✗"}</span><span style={{ color: C.muted }}>{c.label}</span>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 18, fontSize: 12.5, marginBottom: 8 }}>
                <div><span style={{ color: C.faint }}>AI Confidence</span><div style={{ fontFamily: FONT_DISPLAY, fontSize: 18 }}>{m.aiAnalysis.confidence}%</div></div>
                <div><span style={{ color: C.faint }}>Recommendation</span><div style={{ fontWeight: 600 }}>{m.aiAnalysis.recommendation}</div></div>
              </div>
              <div style={{ fontSize: 11.5, color: C.faint }}>{m.aiAnalysis.notes} — AI recommends only; the client makes the final decision.</div>
            </div>
          )}

          {dispute && <DisputeCard dispute={dispute} role={role} onResolve={(full) => onResolveDispute(dispute.id, full)} />}

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            {role === "freelancer" && ["Pending", "In Progress", "Revision Required"].includes(m.status) && (
              <Btn size="sm" onClick={() => setShowSubmit(true)}><Upload size={13} /> Submit Deliverable</Btn>
            )}
            {role === "freelancer" && m.status === "Submitted" && (
              <Btn size="sm" onClick={onAnalyze}><Sparkles size={13} /> Analyze Deliverable with AI</Btn>
            )}
            {role === "client" && m.status === "Client Review" && (
              <>
                <Btn size="sm" variant="green" onClick={onApprove}><CheckCircle2 size={13} /> Approve & Release {money(m.amount)}</Btn>
                <Btn size="sm" variant="ghost" onClick={onRevision}>Request Revision</Btn>
              </>
            )}
            {m.status === "Paid" && <Chip tone="green"><CheckCircle2 size={12} /> Paid</Chip>}
          </div>
          {(m.status === "Client Review" || m.status === "Revision Required") && !dispute && (
            <button onClick={() => setShowDispute(true)} style={{ background: "none", border: "none", color: C.faint, fontSize: 11.5, marginTop: 10, textDecoration: "underline", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 4 }}>
              <Gavel size={11} /> Not satisfied? Raise a dispute instead
            </button>
          )}

          {showSubmit && <SubmitModal onClose={() => setShowSubmit(false)} onSubmit={(d) => { onSubmit(d); setShowSubmit(false); }} />}
          {showDispute && <DisputeModal onClose={() => setShowDispute(false)} onSubmit={(c, f) => { onDispute(c, f); setShowDispute(false); }} />}
        </div>
      )}
    </Card>
  );
}

function SubmitModal({ onClose, onSubmit }) {
  const [type, setType] = useState("text");
  const [content, setContent] = useState("");
  return (
    <Modal title="Submit Deliverable" onClose={onClose} width={480}>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[{ k: "text", i: FileText, l: "Description" }, { k: "link", i: LinkIcon, l: "Link" }, { k: "file", i: Upload, l: "File" }].map((o) => (
          <button key={o.k} onClick={() => setType(o.k)} style={{ flex: 1, background: type === o.k ? C.surface2 : "transparent", border: `1px solid ${type === o.k ? C.gold : C.border}`, borderRadius: 9, padding: "9px 6px", color: type === o.k ? C.text : C.muted, fontSize: 12, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
            <o.i size={14} /> {o.l}
          </button>
        ))}
      </div>
      <Field label={type === "file" ? "File name" : type === "link" ? "URL" : "Description of work completed"}>
        <textarea style={{ ...inputStyle, minHeight: 90, resize: "vertical" }} value={content} onChange={(e) => setContent(e.target.value)} placeholder={type === "file" ? "e.g. final-delivery.zip" : type === "link" ? "https://..." : "Describe what was completed for this milestone..."} />
      </Field>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Btn disabled={!content.trim()} onClick={() => onSubmit({ type, content })}>Submit <Send size={13} /></Btn>
      </div>
    </Modal>
  );
}

function DisputeModal({ onClose, onSubmit }) {
  const [claim, setClaim] = useState("");
  const [response, setResponse] = useState("");
  return (
    <Modal title="Raise Dispute" onClose={onClose} width={520}>
      <p style={{ color: C.muted, fontSize: 12.5, marginBottom: 14 }}>Describe both sides so the AI dispute assistant can produce a fair, non-binding recommendation.</p>
      <Field label="Client's claim / concern"><textarea style={{ ...inputStyle, minHeight: 70 }} value={claim} onChange={(e) => setClaim(e.target.value)} placeholder="e.g. The mobile version was not completed." /></Field>
      <Field label="Freelancer's response"><textarea style={{ ...inputStyle, minHeight: 70 }} value={response} onChange={(e) => setResponse(e.target.value)} placeholder="e.g. Mobile version was completed but needs browser fixes." /></Field>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <Btn variant="danger" disabled={!claim.trim() || !response.trim()} onClick={() => onSubmit(claim, response)}><Gavel size={13} /> Submit for AI Review</Btn>
      </div>
    </Modal>
  );
}

function DisputeCard({ dispute, role, onResolve }) {
  return (
    <div style={{ background: "rgba(232,97,91,.06)", border: `1px solid rgba(232,97,91,.3)`, borderRadius: 10, padding: 14, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 700, fontSize: 13, marginBottom: 10, color: C.red }}><Gavel size={13} /> AI Dispute Summary</div>
      <div style={{ fontSize: 12.5, marginBottom: 6 }}><span style={{ color: C.faint }}>Client claim: </span>{dispute.clientClaim}</div>
      <div style={{ fontSize: 12.5, marginBottom: 10 }}><span style={{ color: C.faint }}>Freelancer response: </span>{dispute.freelancerResponse}</div>
      {dispute.loading ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8, color: C.gold, fontSize: 12.5 }}><Loader2 size={13} /> AI reviewing evidence…</div>
      ) : (
        <>
          <div style={{ fontSize: 12.5, marginBottom: 6, color: C.muted }}>{dispute.aiSummary}</div>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10, color: C.goldSoft }}>Recommendation: {dispute.aiRecommendation}</div>
          {role === "client" && (
            <div style={{ display: "flex", gap: 8 }}>
              <Btn size="sm" variant="green" onClick={() => onResolve(true)}>Accept & Release Payment</Btn>
              <Btn size="sm" variant="ghost" onClick={() => onResolve(false)}>Request Revision Instead</Btn>
            </div>
          )}
          <div style={{ fontSize: 11, color: C.faint, marginTop: 8 }}>AI recommends only — the client makes the final, irreversible decision.</div>
        </>
      )}
    </div>
  );
}

/* ============================== AI ASSISTANT ============================== */
function AssistantPanel({ project, onClose }) {
  const [messages, setMessages] = useState([
    { role: "ai", text: project ? `I can answer questions about "${project.title}" — payments, milestones, deadlines, or disputes.` : "Connect a project to ask questions, or ask me anything about how EscrowX works." },
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  const send = async () => {
    if (!input.trim()) return;
    const q = input.trim();
    setMessages((m) => [...m, { role: "user", text: q }]);
    setInput(""); setLoading(true);
    const context = project ? `Project: "${project.title}". Total: $${project.total}. Milestones: ${project.milestones.map((m) => `${m.name} ($${m.amount}) — ${m.status}`).join("; ")}. Escrow funded: ${project.escrow?.deposited ? "yes" : "no"}. Refund rules: ${(project.refundRules || []).join("; ")}.` : "No specific project is open.";
    const prompt = `You are the EscrowX AI assistant embedded in a Web3 freelance escrow platform. Answer the user's question using ONLY the project data given, in 1-3 concise sentences, in a helpful and direct tone. Do not invent data not provided.
${context}
Question: "${q}"`;
    const ans = await callClaude(prompt);
    setMessages((m) => [...m, { role: "ai", text: ans || "I couldn't reach the AI service just now — please try again in a moment." }]);
    setLoading(false);
  };

  return (
    <div style={{ position: "fixed", right: 0, top: 0, bottom: 0, width: "min(380px,100%)", background: C.surface, borderLeft: `1px solid ${C.border}`, zIndex: 120, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: 16, borderBottom: `1px solid ${C.borderSoft}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 700 }}><Sparkles size={15} color={C.gold} /> EscrowX Assistant</div>
        <button onClick={onClose} style={{ background: "none", border: "none", color: C.muted }}><X size={18} /></button>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
        {messages.map((m, i) => (
          <div key={i} style={{ alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "85%", background: m.role === "user" ? C.gold : C.surface2, color: m.role === "user" ? "#1A1204" : C.text, borderRadius: 12, padding: "9px 12px", fontSize: 13, lineHeight: 1.45 }}>
            {m.text}
          </div>
        ))}
        {loading && <div style={{ alignSelf: "flex-start", color: C.faint, fontSize: 12.5, display: "flex", alignItems: "center", gap: 6 }}><Loader2 size={13} /> thinking…</div>}
        <div ref={endRef} />
      </div>
      <div style={{ padding: 12, borderTop: `1px solid ${C.borderSoft}`, display: "flex", gap: 8 }}>
        <input style={{ ...inputStyle, flex: 1 }} placeholder="Ask about this project…" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
        <Btn size="sm" onClick={send} disabled={loading}><Send size={14} /></Btn>
      </div>
    </div>
  );
}

/* ============================== MOUNT ============================== */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
