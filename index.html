function LucideIcon({ name, size = 24, color = "currentColor", strokeWidth = 2, style, className, onClick, ...rest }) {
  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke={color}
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      style={style}
      className={className}
      onClick={onClick}
      dangerouslySetInnerHTML={{ __html: ICONS[name] }}
      {...rest}
    />
  );
}

/* ============================== HELPERS ============================== */
let _id = 0;
const uid = (p = "id") => { _id += 1; return `${p}_${_id}_${Math.random().toString(36).slice(2, 7)}`; };
const money = (n) => `$${Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
const shortAddr = (a) => a ? `${a.slice(0, 6)}...${a.slice(-4)}` : "";
const fakeHash = () => "0x" + Array.from({ length: 64 }, () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");
const fakeAddr = () => "0x" + Array.from({ length: 40 }, () => "0123456789ABCDEF"[Math.floor(Math.random() * 16)]).join("");
const nowStamp = () => new Date().toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const parseDate = (s) => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d : null; };
const daysBetween = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);
// Today as a local-time YYYY-MM-DD string, for <input type="date" min> and past-date
// checks. Built from local parts (not toISOString) so it doesn't shift a day for
// users behind UTC.
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
// ISO date strings compare correctly as plain strings, so "past" is a simple <.
const isPastDate = (s) => !!s && s < todayISO();
// Furthest-out date a new project's deadline can be set to: 12 months from today,
// so clients are steered toward near-term deadlines (6-12 months out) rather than
// distant/open-ended ones. Built from local date parts, same reasoning as todayISO.
const maxDeadlineISO = () => {
  const d = new Date();
  d.setMonth(d.getMonth() + 12);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const isTooFarDate = (s) => !!s && s > maxDeadlineISO();
const prettyDate = (s) => { const d = parseDate(s); return d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : s; };

const MILESTONE_FLOW = ["Pending", "In Progress", "Submitted", "AI Review", "Client Review", "Approved", "Paid"];

/* ============================== RISK DETECTION SYSTEM ==============================
   EscrowX's risk detection is an explainable, multi-signal engine. It is advisory
   only: it never blocks, approves, or reverses any escrow action. All fund-movement
   decisions remain with the client, the freelancer, and EscrowX's own dispute /
   escrow logic elsewhere in this file. The engine below only ever WRITES to
   `project.riskScore` — it has no side effects on milestones, payments, or escrow.
====================================================================================== */

// Lightweight account-reputation lookup. In production this would be pulled from
// each account's on-platform history; here it's a small local table (keyed by the
// display name used elsewhere in the app) with a neutral, clearly-flagged fallback
// for counterparties EscrowX has no history on yet.
const REPUTATION_DB = {
  "Alex Morgan": { role: "client", rating: 4.7, completedProjects: 18, approvalRate: 0.95, onTimeRate: 0.93, unresolvedDisputes: 0, refundIncidents: 0, accountAgeMonths: 22, activityConsistency: "steady" },
  "Alex Morgan (You)": { role: "client", rating: 4.7, completedProjects: 18, approvalRate: 0.95, onTimeRate: 0.93, unresolvedDisputes: 0, refundIncidents: 0, accountAgeMonths: 22, activityConsistency: "steady" },
  "Sarah Chen": { role: "freelancer", rating: 4.8, completedProjects: 27, approvalRate: 0.96, onTimeRate: 0.96, unresolvedDisputes: 0, refundIncidents: 0, accountAgeMonths: 31, activityConsistency: "steady" },
};
const getReputation = (name, roleGuess) => {
  const known = REPUTATION_DB[name];
  if (known) return { name, isNew: false, ...known };
  // Neutral, non-accusatory default for an account EscrowX has no track record on yet.
  // Being new isn't treated as "risky" behavior — it's treated as "insufficient
  // history", which is scored gently and explained plainly.
  return { name, role: roleGuess, isNew: true, rating: null, completedProjects: 0, approvalRate: null, onTimeRate: null, unresolvedDisputes: 0, refundIncidents: 0, accountAgeMonths: 0, activityConsistency: "unknown" };
};

// Deterministic, explainable scoring engine. Returns a 0-100 riskScore (higher =
// more worth a closer look), a neutral level label, and the individual signals
// ("factors") that produced it — never a single opaque number.
function computeRisk(proj) {
  const factors = []; // { id, category, label, detail, tone: 'good'|'watch'|'caution', points }
  let score = 0;
  const add = (category, label, detail, points, tone) => {
    score += points;
    factors.push({ id: uid("rf"), category, label, detail, tone, points });
  };

  const total = proj.total || proj.milestones.reduce((s, m) => s + Number(m.amount || 0), 0) || 1;
  const msCount = proj.milestones.length;
  const maxShare = msCount ? Math.max(...proj.milestones.map((m) => Number(m.amount || 0))) / total : 0;

  /* ---- 1. Project & milestone structure ---- */
  // Concentration is only a separate signal when there are several milestones — for a
  // single-milestone project it's the same observation as the lump-sum factor below,
  // and scoring both would double-count one fact.
  if (msCount < 2) {
    add("Project structure", "Single lump-sum milestone", "The project has only one milestone, so the full amount is due at once with no incremental checkpoint along the way.", 12, "caution");
  } else if (maxShare > 0.5) {
    add("Project structure", "Payment concentration", `One milestone represents ${Math.round(maxShare * 100)}% of total value — if it fails or is disputed, a large share of funds is affected at once.`, 14, "caution");
  } else if (maxShare > 0.35) {
    add("Project structure", "Uneven milestone sizing", `The largest milestone represents ${Math.round(maxShare * 100)}% of total value.`, 6, "watch");
  } else {
    add("Project structure", "Balanced milestone sizing", "Payments are broken into reasonably even milestones, which limits exposure if any single one has an issue.", 0, "good");
  }
  const tightGaps = proj.milestones.filter((m, i) => {
    if (i === 0) return false;
    const prev = parseDate(proj.milestones[i - 1].deadline), cur = parseDate(m.deadline);
    return prev && cur && daysBetween(cur, prev) < 5;
  }).length;
  if (tightGaps > 0) {
    add("Project structure", "Tight milestone spacing", `${tightGaps} milestone deadline${tightGaps > 1 ? "s sit" : " sits"} less than 5 days after the previous one, leaving little review buffer.`, Math.min(8, tightGaps * 4), "watch");
  }
  // Front-loaded payment: a large first milestone means money leaves escrow before
  // much of the work has been demonstrated.
  if (msCount > 1) {
    const firstShare = Number(proj.milestones[0].amount || 0) / total;
    if (firstShare > 0.5) {
      add("Project structure", "Front-loaded payment schedule", `The first milestone alone is ${Math.round(firstShare * 100)}% of the project value, so most of the money is committed before later work is demonstrated.`, 8, "caution");
    } else if (firstShare > 0.35) {
      add("Project structure", "Slightly front-loaded schedule", `The first milestone is ${Math.round(firstShare * 100)}% of the project value.`, 4, "watch");
    }
  }

  /* ---- 1b. Scope clarity — vague or incomplete milestone definitions ---- */
  const vagueMs = proj.milestones.filter((m) => !m.description || String(m.description).trim().length < 25).length;
  if (vagueMs > 0) {
    add("Scope clarity", "Loosely specified deliverable(s)", `${vagueMs} milestone${vagueMs > 1 ? "s have" : " has"} little or no written description. Thin acceptance criteria are the most common source of later disagreement about whether work was delivered.`, Math.min(10, vagueMs * 5), "caution");
  } else {
    add("Scope clarity", "Deliverables are clearly described", "Every milestone states what must be delivered, which gives both sides a concrete standard to review against.", 0, "good");
  }
  const noDeadlineMs = proj.milestones.filter((m) => !m.deadline).length;
  if (noDeadlineMs > 0) {
    add("Scope clarity", "Milestone(s) without a deadline", `${noDeadlineMs} milestone${noDeadlineMs > 1 ? "s have" : " has"} no date attached, so lateness can't be measured objectively.`, Math.min(8, noDeadlineMs * 4), "watch");
  }
  const pastProjectDeadline = proj.milestones.filter((m) => m.deadline && proj.deadline && m.deadline > proj.deadline).length;
  if (pastProjectDeadline > 0) {
    add("Scope clarity", "Milestone scheduled after the project deadline", `${pastProjectDeadline} milestone${pastProjectDeadline > 1 ? "s are" : " is"} due after the project's own final deadline, so the schedule is internally inconsistent.`, 7, "caution");
  }

  /* ---- 1c. Financial exposure ---- */
  // Scales with order of magnitude rather than stepping at arbitrary thresholds, so
  // two projects of different size rarely score identically.
  const exposurePoints = Math.max(0, Math.min(9, Math.round(Math.log10(Math.max(total, 1) / 500) * 4)));
  if (exposurePoints > 0) {
    add("Financial exposure", "Larger amount at stake", `${money(total)} is held against this engagement. Larger balances raise the cost of any single milestone going wrong.`, exposurePoints, exposurePoints >= 6 ? "caution" : "watch");
  } else {
    add("Financial exposure", "Modest total exposure", `${money(total)} is a small balance to have in escrow, which limits the downside of any single disagreement.`, 0, "good");
  }

  /* ---- 1d. Timeline pressure ---- */
  const finalDeadline = parseDate(proj.deadline);
  if (finalDeadline) {
    const daysToDeadline = daysBetween(finalDeadline, new Date());
    if (daysToDeadline < 0) {
      add("Timeline", "Project deadline has already passed", `The stated final deadline (${proj.deadline}) is in the past.`, 12, "caution");
    } else if (daysToDeadline <= 7) {
      add("Timeline", "Very compressed timeline", `Only ${daysToDeadline} day${daysToDeadline === 1 ? "" : "s"} remain until the final deadline, leaving almost no room for review or revision.`, 10, "caution");
    } else if (daysToDeadline <= 21) {
      add("Timeline", "Tight timeline", `${daysToDeadline} days remain until the final deadline across ${msCount} milestone${msCount === 1 ? "" : "s"}.`, 5, "watch");
    } else if (daysToDeadline <= 45) {
      add("Timeline", "Moderate timeline", `${daysToDeadline} days remain until the final deadline.`, 2, "watch");
    } else if (daysToDeadline > 240) {
      add("Timeline", "Long project horizon", `The final deadline is ${daysToDeadline} days out. Long engagements are more exposed to changing scope and availability on both sides.`, 3, "watch");
    } else {
      add("Timeline", "Comfortable timeline", `${daysToDeadline} days remain until the final deadline, leaving room for review and revision.`, 0, "good");
    }
    if (msCount > 0 && daysToDeadline > 0 && daysToDeadline / msCount < 7) {
      add("Timeline", "Little time per milestone", `That works out to roughly ${Math.max(1, Math.round(daysToDeadline / msCount))} day${Math.round(daysToDeadline / msCount) === 1 ? "" : "s"} per milestone including review time.`, 4, "watch");
    }
  }

  /* ---- 1e. Contractual protections the client opted into ---- */
  const ruleCount = (proj.refundRules || []).length;
  if (ruleCount === 0) {
    add("Refund protections", "No refund rules attached", "This engagement has no smart refund rules, so there is no pre-agreed outcome if work is late, cancelled, or rejected.", 9, "caution");
  } else if (ruleCount === 1) {
    add("Refund protections", "Minimal refund protection", "Only one refund rule is attached, so several common failure cases have no pre-agreed outcome.", 4, "watch");
  } else if (ruleCount >= 3) {
    add("Refund protections", "Strong refund protections", `${ruleCount} smart refund rules are attached, covering the common ways an engagement can go wrong.`, 0, "good");
  }

  /* ---- 2 & 3. Account reputation, completed work, and ratings ---- */
  const clientRep = getReputation(proj.client, "client");
  const freelancerRep = getReputation(proj.freelancer, "freelancer");
  [["Client", clientRep], ["Freelancer", freelancerRep]].forEach(([label, rep]) => {
    if (rep.isNew) {
      add("Account reputation", `${label} has no prior history`, `${rep.name} has no completed projects on EscrowX yet. This isn't evidence of a problem — just a gap in track record, so early milestones carry more inherent uncertainty.`, 10, "watch");
      return;
    }
    if (rep.rating >= 4.5 && rep.completedProjects >= 5) {
      add("Account reputation", `${label} has a strong track record`, `${rep.name} — ${rep.rating}/5 rating across ${rep.completedProjects} completed projects.`, 0, "good");
    } else if (rep.rating < 3.8 || rep.completedProjects < 3) {
      add("Account reputation", `${label} has a limited or mixed track record`, `${rep.name} — ${rep.rating != null ? rep.rating + "/5 rating, " : ""}${rep.completedProjects} completed project${rep.completedProjects === 1 ? "" : "s"}.`, 10, "caution");
    }
  });

  /* ---- 4. On-time delivery & reliability ---- */
  [["Client", clientRep], ["Freelancer", freelancerRep]].forEach(([label, rep]) => {
    if (rep.onTimeRate == null) return;
    if (rep.onTimeRate < 0.75) add("Reliability", `${label} on-time rate is below average`, `${rep.name} has delivered/responded on time ${Math.round(rep.onTimeRate * 100)}% of the time historically.`, 10, "caution");
    else if (rep.onTimeRate < 0.9) add("Reliability", `${label} on-time rate is moderate`, `${rep.name}'s historical on-time rate is ${Math.round(rep.onTimeRate * 100)}%.`, 4, "watch");
  });
  const overdue = proj.milestones.filter((m) => {
    if (m.status === "Paid" || m.status === "Pending") return false;
    const dl = parseDate(m.deadline);
    return dl && daysBetween(new Date(), dl) > 0;
  });
  if (overdue.length > 0) {
    add("Reliability", "Active milestone(s) past their deadline", `${overdue.length} in-progress milestone${overdue.length > 1 ? "s are" : " is"} past its stated deadline in this engagement.`, Math.min(15, overdue.length * 8), "caution");
  }
  const paidLate = proj.milestones.filter((m) => m.status === "Paid" && m.deadline && m.paidAtDate && m.paidAtDate > parseDate(m.deadline));

  /* ---- 5. Dispute history ---- */
  const openDisputes = proj.disputes.filter((d) => d.status === "Open").length;
  const resolvedDisputes = proj.disputes.filter((d) => d.status === "Resolved").length;
  if (openDisputes > 0) add("Dispute history", "Open dispute on this engagement", `${openDisputes} dispute${openDisputes > 1 ? "s are" : " is"} currently open and unresolved.`, Math.min(15, openDisputes * 12), "caution");
  if (resolvedDisputes > 0) add("Dispute history", "Past dispute on this engagement", `${resolvedDisputes} dispute${resolvedDisputes > 1 ? "s have" : " has"} been raised and resolved previously in this project.`, Math.min(8, resolvedDisputes * 4), "watch");
  const priorDisputes = (clientRep.unresolvedDisputes || 0) + (freelancerRep.unresolvedDisputes || 0);
  if (priorDisputes > 0) add("Dispute history", "Unresolved disputes on an account", `A party to this engagement has ${priorDisputes} unresolved dispute${priorDisputes > 1 ? "s" : ""} elsewhere on the platform.`, Math.min(15, priorDisputes * 10), "caution");
  if (openDisputes === 0 && resolvedDisputes === 0 && priorDisputes === 0) {
    add("Dispute history", "No dispute history", "Neither party has an open, past, or platform-wide unresolved dispute associated with this engagement.", 0, "good");
  }

  /* ---- 6. Payment & refund behavior ---- */
  const totalRevisions = proj.milestones.reduce((s, m) => s + (m.revisions || 0), 0);
  if (totalRevisions >= 3) add("Payment & refund behavior", "Repeated revision requests", `${totalRevisions} revision rounds have been requested across this project's milestones so far.`, 6, "watch");
  const refundTx = (proj.transactions || []).filter((t) => /refund/i.test(t.type)).length;
  if (refundTx > 0 || (clientRep.refundIncidents || 0) + (freelancerRep.refundIncidents || 0) > 0) {
    add("Payment & refund behavior", "Refund activity on record", "There is refund history associated with this engagement or one of the accounts involved.", 6, "watch");
  } else {
    add("Payment & refund behavior", "No refund activity", "No refunds have been triggered on this engagement so far.", 0, "good");
  }

  /* ---- 7. Account / activity patterns ---- */
  [["Client", clientRep], ["Freelancer", freelancerRep]].forEach(([label, rep]) => {
    if (rep.isNew) return; // already counted above
    if (rep.accountAgeMonths < 1) add("Account activity", `${label} account is brand new`, `${rep.name}'s account was created under a month ago.`, 8, "caution");
    else if (rep.accountAgeMonths < 3) add("Account activity", `${label} account is fairly new`, `${rep.name}'s account is ${rep.accountAgeMonths} months old.`, 3, "watch");
  });

  /* ---- 8 & 9. Deliverable quality & AI-based deliverable analysis ---- */
  const analyzed = proj.milestones.filter((m) => m.aiAnalysis);
  if (analyzed.length === 0) {
    add("Deliverable quality", "No deliverables analyzed yet", "No milestone submissions have been reviewed by the AI verification module yet, so deliverable quality can't be factored in.", 0, "watch");
  } else {
    const avgConfidence = Math.round(analyzed.reduce((s, m) => s + (m.aiAnalysis.confidence || 0), 0) / analyzed.length);
    const failingChecks = analyzed.reduce((s, m) => s + (m.aiAnalysis.checks || []).filter((c) => c.pass === false || c.pass === "warn").length, 0);
    if (avgConfidence >= 85 && failingChecks === 0) {
      add("Deliverable quality", "AI review of submissions is strong", `Average AI match confidence across ${analyzed.length} reviewed submission${analyzed.length > 1 ? "s" : ""} is ${avgConfidence}%, with no failed requirement checks.`, 0, "good");
    } else if (avgConfidence < 60 || failingChecks >= 3) {
      add("Deliverable quality", "AI review flagged notable gaps", `Average AI match confidence is ${avgConfidence}% with ${failingChecks} requirement check${failingChecks === 1 ? "" : "s"} flagged as failed or needing attention.`, 12, "caution");
    } else {
      add("Deliverable quality", "AI review found minor gaps", `Average AI match confidence is ${avgConfidence}%, with ${failingChecks} requirement check${failingChecks === 1 ? "" : "s"} flagged for attention.`, 5, "watch");
    }
  }

  score = Math.max(0, Math.min(100, Math.round(score)));
  const level = score < 35 ? "Low" : score < 65 ? "Moderate" : "Elevated";
  const cautionCount = factors.filter((f) => f.tone === "caution").length;
  const summary = level === "Low"
    ? "Signals across reputation, structure, and delivery history are broadly favorable."
    : level === "Moderate"
    ? `A mix of favorable and watch-worthy signals — ${cautionCount} factor${cautionCount === 1 ? "" : "s"} worth a closer look.`
    : `Several signals point to elevated uncertainty — ${cautionCount} factor${cautionCount === 1 ? "" : "s"} flagged as a caution.`;

  return { score, level, factors, summary, generatedAt: nowStamp() };
}

// Deterministic fallback recommendation text, used only when the AI call is
// unavailable. This — like the AI-generated version — is advisory phrasing
// layered on top of the deterministic score above, never a decision in itself.
function fallbackRiskRecommendation(risk) {
  if (risk.level === "Low") return "No action needed based on current signals. Continue with standard milestone review.";
  if (risk.level === "Moderate") return "Consider reviewing flagged factors before approving the next milestone; standard escrow protections remain in place regardless.";
  return "Recommend extra scrutiny on the next submission and clear documentation before releasing funds. This is advisory only — EscrowX does not block or alter any action automatically.";
}

// Recomputes the explainable risk assessment for a project and asks the AI module
// for a short, clearly non-binding recommendation to accompany it. Only ever
// writes to project.riskScore.
async function assessRisk(proj) {
  const risk = computeRisk(proj);
  const prompt = `You are EscrowX's risk advisory assistant. You do NOT make decisions and you must NEVER label anyone a "scammer" or similar — use neutral terms only (Low Risk / Moderate Risk / Elevated Risk). Funds, approvals, and disputes are always decided by the client, freelancer, and EscrowX's own escrow logic — you only advise.
Here is an explainable risk assessment already computed by EscrowX's risk detection system for this engagement:
Score: ${risk.score}/100 (${risk.level} Risk)
Signals considered: ${risk.factors.map((f) => `${f.label} (${f.category}, ${f.tone})`).join("; ")}
Project: "${proj.title}" — total value $${proj.total}, ${proj.milestones.length} milestone(s).
In ONE short sentence, give a specific, non-binding, practical recommendation for what the client should consider next given these signals (e.g. what to watch for, or that things look fine). Return ONLY plain text, no JSON, no markdown, under 220 characters.`;
  const aiText = await callClaude(prompt);
  return { ...risk, aiRecommendation: (aiText && aiText.length < 400) ? aiText.trim() : fallbackRiskRecommendation(risk) };
}

async function callClaude(prompt, { json = false } = {}) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
      }),
    });
    const data = await res.json();
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
    if (json) {
      const clean = text.replace(/```json|```/g, "").trim();
      const start = clean.indexOf("{");
      const end = clean.lastIndexOf("}");
      return JSON.parse(clean.slice(start, end + 1));
    }
    return text.trim();
  } catch (e) {
    return null;
  }
}

            <span style={{ fontFamily: FONT_DISPLAY, fontSize: 19, fontWeight: 600 }}>EscrowX</span>
          </div>
        </div>

        <div className="fade-up" style={{ textAlign: "center", marginBottom: 70 }}>
          <Chip tone="gold" style={{ marginBottom: 22 }}><Sparkles size={12} /> AI-Powered Web3 Escrow</Chip>
          <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: "clamp(40px,7vw,74px)", fontWeight: 600, lineHeight: 1.05, margin: "0 0 20px" }}>
            Build. Deliver.<br /><span style={{ color: C.gold, fontStyle: "italic" }}>Get Paid.</span> With Trust.
          </h1>
          <p style={{ color: C.muted, fontSize: 17, maxWidth: 520, margin: "0 auto 34px", lineHeight: 1.6 }}>
            AI-powered Web3 escrow that protects both sides of every freelance transaction — funds locked on-chain, released only when work is verified.
          </p>
          <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
            <Btn size="lg" onClick={onDemo}>Explore Demo</Btn>
          </div>
        </div>

        <Card style={{ padding: "28px 20px", marginBottom: 60, background: C.surface }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 6 }}>
            {steps.map((s, i) => (
              <div key={s} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, minWidth: 64 }}>
                  <div style={{ width: 36, height: 36, borderRadius: "50%", border: `1.5px solid ${C.gold}`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT_MONO, fontSize: 12, color: C.gold }}>{i + 1}</div>
                  <span style={{ fontSize: 12.5, color: C.muted, fontWeight: 600 }}>{s}</span>
                </div>
                {i < steps.length - 1 && <ArrowRight size={14} color={C.faint} style={{ marginBottom: 22 }} />}
              </div>
            ))}
          </div>
        </Card>

        <div style={{ marginBottom: 20 }}>
          <h2 style={{ fontFamily: FONT_DISPLAY, fontSize: 28, textAlign: "center", marginBottom: 34 }}>Why EscrowX?</h2>
          {(() => {
            const features = [
              { icon: Lock, t: "Trustless Payments", d: "Funds locked in escrow until milestone conditions are met — no intermediaries." },
              { icon: Sparkles, t: "AI-Powered Verification", d: "Deliverables are analyzed against agreed requirements before you review." },
              { icon: ShieldCheck, t: "Milestone Protection", d: "Break work into milestones so payment always tracks progress." },
              { icon: History, t: "Transparent Transactions", d: "Every deposit, release, and refund is logged with a verifiable receipt." },
              { icon: TrendingUp, t: "Built for Global Freelancing", d: "Works across borders — no bank delays, no chargebacks." },
            ];
            const topRow = features.slice(0, 3);
            const bottomRow = features.slice(3);
            const cardWidth = "calc((100% - 28px) / 3)";
            const renderCard = (f) => (
              <Card key={f.t} style={{ width: cardWidth, minWidth: 210 }}>
                <f.icon size={20} color={C.gold} style={{ marginBottom: 12 }} />
                <div style={{ fontWeight: 600, marginBottom: 6, fontSize: 14.5 }}>{f.t}</div>
                <div style={{ color: C.muted, fontSize: 13, lineHeight: 1.5 }}>{f.d}</div>
              </Card>
            );
            return (
              <div style={{ display: "flex", flexDirection: "column", gap: 14, alignItems: "center" }}>
                <div style={{ display: "flex", gap: 14, width: "100%", flexWrap: "wrap", justifyContent: "center" }}>
                  {topRow.map(renderCard)}
                </div>
                <div style={{ display: "flex", gap: 14, width: "100%", flexWrap: "wrap", justifyContent: "center" }}>
                  {bottomRow.map(renderCard)}
                </div>
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

    setShowNotif((s) => {
      const next = !s;
      if (next) onViewNotifications();
      return next;
    });
  };
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 40, background: "rgba(11,14,23,.92)", backdropFilter: "blur(8px)", borderBottom: `1px solid ${C.borderSoft}` }}>
      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "12px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 22 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }} onClick={() => setView(role === "client" ? "client" : "freelancer")}>
            <div style={{ width: 26, height: 26, borderRadius: 7, border: `2px solid ${C.gold}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <ShieldCheck size={13} color={C.gold} />
            </div>
            <span style={{ fontFamily: FONT_DISPLAY, fontSize: 16.5, fontWeight: 600, color: C.text }}>EscrowX</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }} title="Demo only: lets you preview the app from either side. In a real deployment, clients and freelancers would each have their own separate account.">
            <span style={{ fontSize: 10.5, color: C.faint, fontWeight: 600, textTransform: "uppercase", letterSpacing: .4 }}>Viewing as</span>
            <div style={{ display: "flex", background: C.surface2, borderRadius: 10, padding: 3 }}>
              {["client", "freelancer"].map((r) => (
                <button key={r} onClick={() => { setRole(r); setView(r); }} style={{ border: "none", background: role === r ? C.gold : "transparent", color: role === r ? "#1A1204" : C.muted, borderRadius: 8, padding: "6px 14px", fontSize: 12.5, fontWeight: 600, textTransform: "capitalize" }}>{r}</button>
              ))}

          <button onClick={() => setView("transactions")} style={{ background: "none", border: "none", color: view === "transactions" ? C.gold : C.muted, fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}><History size={14} /> Transactions</button>
          {profile?.name && (
            <span style={{ fontSize: 12, color: C.faint, display: "flex", alignItems: "center", gap: 5 }}><UserCircle2 size={13} /> {profile.name}</span>
          )}
          <button onClick={onBackToLogin} title="Log Out" style={{ background: "none", border: "none", color: C.faint, fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 4, padding: 0 }}>
            <ArrowRight size={12} style={{ transform: "rotate(180deg)" }} /> Log Out

        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ position: "relative" }}>
            <button onClick={toggleNotif} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 9, padding: 8, color: C.text, position: "relative" }}>
              <Bell size={15} />
              {unread > 0 && <span style={{ position: "absolute", top: -3, right: -3, background: C.red, color: "#fff", fontSize: 9, borderRadius: 999, minWidth: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>{unread}</span>}
            </button>
            {showNotif && (
              <div style={{ position: "absolute", right: 0, top: 40, width: 300, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 8, maxHeight: 340, overflowY: "auto" }}>
                {notifications.length === 0 && <div style={{ padding: 14, color: C.faint, fontSize: 13 }}>No notifications yet.</div>}
                {notifications.slice().reverse().map((n) => (
                  <div key={n.id} style={{ padding: "9px 10px", borderRadius: 8, fontSize: 12.5, color: C.text, borderBottom: `1px solid ${C.borderSoft}` }}>
                    <div>{n.text}</div>
                    <div style={{ color: C.faint, fontSize: 10.5, marginTop: 2 }}>{n.time}</div>
                  </div>

          </div>
          <Btn size="sm" variant="ghost" onClick={onOpenAssistant}><Sparkles size={13} /> Assistant</Btn>
          {wallet.connected ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 9, padding: "7px 12px" }}>
              <div style={{ width: 7, height: 7, borderRadius: "50%", background: C.green }} />

/* ============================== APP ============================== */
function App() {
  const [screen, setScreen] = useState("landing"); // landing | app
  const [profile, setProfile] = useState(null); // { name, email }, shown in navbar when set
  const [view, setView] = useState("client"); // client | freelancer | project | transactions
  const [role, setRole] = useState("client");
  const [wallet, setWallet] = useState({ connected: false, address: "", balance: 12450, network: "Ethereum Sepolia · Testnet (Simulated)" });
  const [projects, setProjects] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [currentProjectId, setCurrentProjectId] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [showAssistant, setShowAssistant] = useState(false);
  const [unread, setUnread] = useState(0);
  const [demoMode, setDemoMode] = useState(false);
  const [toast, setToast] = useState(null);
  const showToast = (text) => {
    const tid = uid("toast");
    setToast({ id: tid, text });
    setTimeout(() => setToast((t) => (t && t.id === tid ? null : t)), 3200);
  };

  const currentProject = projects.find((p) => p.id === currentProjectId) || null;

  const pushNotif = (text) => {
    setNotifications((n) => [...n, { id: uid("ntf"), text, time: nowStamp() }]);
    setUnread((u) => u + 1);
  };
  const updateProject = (id, updater) => {
    setProjects((ps) => ps.map((p) => (p.id === id ? updater({ ...p }) : p)));
  };
  // Re-runs the explainable risk assessment using the project's latest state
  // (new deliverable analysis, on-time/late outcome, dispute, revision, etc.)
  // and writes the refreshed result to project.riskScore. Advisory only — never
  // touches milestones, escrow, or payments.
  const refreshRisk = (projId) => {
    setProjects((ps) => {
      const proj = ps.find((p) => p.id === projId);
      if (proj) assessRisk(proj).then((risk) => updateProject(projId, (p) => { p.riskScore = risk; return p; }));
      return ps;
    });
  };
  const logActivity = (proj, text) => proj.activity.push({ date: nowStamp(), text });
  const addTx = (proj, type, amount) => {
    proj.transactions.push({ id: uid("tx"), type, date: nowStamp(), amount, status: "Confirmed", wallet: shortAddr(proj.escrow?.walletAddress || wallet.address), txId: fakeHash().slice(0, 14) + "…", demo: true });
  };

  const connectWallet = () => {
    setWallet((w) => ({ ...w, address: fakeAddr() }));
    setTimeout(() => setWallet((w) => ({ ...w, connected: true })), 500);
  };

  const enterDemo = () => {
    const demo = seedDemoProject();
    setProjects([demo]);
    setWallet({ connected: true, address: fakeAddr(), balance: 12450, network: "Ethereum Sepolia · Testnet (Simulated)" });
    setDemoMode(true);
    pushNotif("Demo Mode loaded: E-commerce Website project ready.");
    setScreen("app");
    setRole("client");
    setView("client");
  };

  const logout = () => {
    setProfile(null);
    setWallet({ connected: false, address: "", balance: 12450, network: "Ethereum Sepolia · Testnet (Simulated)" });
    setScreen("landing");
  };

  /* ---- Project creation ---- */
  const createProject = async (data) => {
    const total = data.milestones.reduce((s, m) => s + Number(m.amount || 0), 0);
    const proj = {
      id: uid("proj"),
      title: data.title, description: data.description, client: "Alex Morgan (You)", freelancer: data.freelancer,
      total, deadline: data.deadline,
      milestones: data.milestones.map((m) => ({ id: uid("ms"), ...m, amount: Number(m.amount), status: "Pending", deliverable: null, aiAnalysis: null, paymentStatus: "Locked", revisions: 0 })),
      agreement: null, refundRules: data.refundRules,
      escrow: { deposited: false, amount: total, walletAddress: null, escrowId: null, txStatus: null, network: wallet.network, timestamp: null },
      // A newly created project is only ASSIGNED to the freelancer, not yet accepted.
      // The agreement/escrow flow is gated on assignmentStatus === "Accepted" below.
      assignmentStatus: "Pending",
      riskScore: null, disputes: [], transactions: [], activity: [{ date: nowStamp(), text: `Project created and assigned to ${data.freelancer} — awaiting their acceptance.` }],
    };
    setProjects((ps) => [...ps, proj]);
    setCurrentProjectId(proj.id);
    pushNotif(`Project "${proj.title}" assigned to ${proj.freelancer} — awaiting their response.`);

    // Explainable, multi-signal risk assessment (fire and forget with fallback).
    // This never blocks project creation — it's advisory and attaches after the fact.
    const risk = await assessRisk(proj);
    updateProject(proj.id, (p) => { p.riskScore = risk; return p; });
    return proj.id;
  };

  /* ---- Assignment accept / decline ---- */
  // The freelancer's response to a client's project assignment. Nothing about the
  // engagement (agreement generation, escrow deposit, milestone work) can proceed
  // until this resolves to "Accepted" — see the gating in ProjectDetail.
  const respondToAssignment = (projId, accept) => {
    updateProject(projId, (p) => {
      p.assignmentStatus = accept ? "Accepted" : "Declined";
      logActivity(p, accept ? `${p.freelancer} accepted the project assignment.` : `${p.freelancer} declined the project assignment.`);
      return p;
    });
    const proj = projects.find((p) => p.id === projId);
    if (accept) {
      pushNotif(`${proj?.freelancer || "Freelancer"} accepted "${proj?.title || "the project"}" — you can now generate the agreement and fund escrow.`);
      showToast(`✓ Assignment accepted`);
    } else {
      pushNotif(`${proj?.freelancer || "Freelancer"} declined "${proj?.title || "the project"}".`);
    }
  };

  const generateAgreement = async (projId) => {
    const proj = projects.find((p) => p.id === projId);
    updateProject(projId, (p) => { p.agreementLoading = true; return p; });
    const prompt = `Draft a structured freelance smart escrow agreement in plain text (no markdown symbols) for a Web3 escrow platform called EscrowX. Include sections: Scope, Deliverables, Milestones & Payment (list each with amount), Deadlines, Acceptance Conditions, Revision Limits, Cancellation/Refund Conditions, Dispute Conditions. Keep it concise and professional.
Project: "${proj.title}" — ${proj.description}
Client: ${proj.client}. Freelancer: ${proj.freelancer}. Total: $${proj.total}. Deadline: ${proj.deadline}.
Milestones: ${proj.milestones.map((m) => `${m.name} — $${m.amount}, due ${m.deadline}: ${m.description}`).join(" | ")}
Refund rules to include verbatim: ${proj.refundRules.join("; ")}`;
    const text = await callClaude(prompt);
    updateProject(projId, (p) => {
      p.agreement = text || fallbackAgreement(p);
      p.agreementLoading = false;
      return p;
    });
  };
  const fallbackAgreement = (p) => `SMART AGREEMENT — ${p.title}\n\nScope: ${p.description}\n\nMilestones & Payment:\n${p.milestones.map((m, i) => `${i + 1}. ${m.name} — $${m.amount}`).join("\n")}\n\nDeadlines: Final delivery due ${p.deadline}.\n\nAcceptance Conditions: Client reviews each submission; AI provides a non-binding analysis. Final approval is a client decision.\n\nRevision Limits: Up to 2 revision rounds per milestone.\n\nCancellation/Refund:\n${p.refundRules.map((r) => "- " + r).join("\n")}\n\nDispute Conditions: Either party may raise a dispute; the AI dispute assistant provides a recommendation, not a final decision.`;

  const depositEscrow = (projId) => {
    updateProject(projId, (p) => { p.depositLoading = true; return p; });
    setTimeout(() => {
      updateProject(projId, (p) => {
        p.escrow = { deposited: true, amount: p.total, walletAddress: fakeAddr(), escrowId: "ESC-" + uid("").slice(-6).toUpperCase(), txStatus: "Confirmed (Simulated)", network: wallet.network, timestamp: nowStamp() };
        p.depositLoading = false;
        p.milestones[0].status = "In Progress";
        addTx(p, "Escrow Created", p.total);
        addTx(p, "Funds Deposited", p.total);
        logActivity(p, `Escrow funded with $${p.total}.`);
        return p;
      });
      pushNotif(`Escrow funded — $${projects.find((p) => p.id === projId)?.total || ""} secured.`);
    }, 1300);
  };

  /* ---- Milestone lifecycle ---- */
  const submitDeliverable = (projId, msId, deliverable) => {
    updateProject(projId, (p) => {
      const m = p.milestones.find((x) => x.id === msId);
      m.deliverable = deliverable; m.status = "Submitted"; m.aiAnalysis = null;
      logActivity(p, `Freelancer submitted deliverable for "${m.name}".`);
      return p;
    });
    pushNotif(`Deliverable submitted for milestone.`);
  };

  const analyzeDeliverable = async (projId, msId) => {
    updateProject(projId, (p) => { const m = p.milestones.find((x) => x.id === msId); m.status = "AI Review"; m.analyzing = true; return p; });
    const proj = projects.find((p) => p.id === projId);
    const m = proj.milestones.find((x) => x.id === msId);
    const prompt = `You are the AI deliverable verification module for EscrowX, a Web3 escrow platform. Compare the freelancer's submission against the milestone requirement and return ONLY JSON:
{"checks": [{"label": "<short requirement check>", "pass": true|false|"warn"}], "confidence": <0-100 integer>, "recommendation": "<one short recommendation phrase like 'Approve' or 'Approve with minor revision' or 'Request revision'>", "notes": "<one sentence>"}
Milestone requirement: "${m.description}"
Freelancer submission (${m.deliverable.type}): "${m.deliverable.content}"
Provide 3-5 checks relevant to the requirement.`;
    const result = await callClaude(prompt, { json: true });
    const analysis = result || {
      checks: [{ label: "Deliverable matches core requirement", pass: true }, { label: "Submission format is complete", pass: true }, { label: "Minor details may need review", pass: "warn" }],
      confidence: 84, recommendation: "Approve with minor revision", notes: "Submission appears to substantially satisfy the milestone requirement.",
    };
    updateProject(projId, (p) => {
      const mm = p.milestones.find((x) => x.id === msId);
      mm.aiAnalysis = analysis; mm.status = "Client Review"; mm.analyzing = false;
      logActivity(p, `AI analysis complete for "${mm.name}": ${analysis.confidence}% confidence — ${analysis.recommendation}.`);
      return p;
    });
    pushNotif(`AI analysis completed for a milestone — client approval required.`);
    refreshRisk(projId);
  };

  const approveMilestone = (projId, msId) => {
    updateProject(projId, (p) => {
      const m = p.milestones.find((x) => x.id === msId);
      m.status = "Paid"; m.paymentStatus = "Released"; m.paidAt = nowStamp(); m.paidAtDate = new Date();
      addTx(p, "Milestone Approved", m.amount);
      addTx(p, "Payment Released", m.amount);
      logActivity(p, `Client approved "${m.name}". $${m.amount} released.`);
      const idx = p.milestones.findIndex((x) => x.id === msId);
      if (p.milestones[idx + 1] && p.milestones[idx + 1].status === "Pending") p.milestones[idx + 1].status = "In Progress";
      return p;
    });
    pushNotif(`Payment released for milestone.`);
    showToast(`✓ Payment released — funds sent to freelancer`);
    refreshRisk(projId);
  };

  const requestRevision = (projId, msId) => {
    updateProject(projId, (p) => {
      const m = p.milestones.find((x) => x.id === msId);
      m.status = "Revision Required"; m.revisions += 1;
      logActivity(p, `Client requested revision on "${m.name}".`);
      return p;
    });
    pushNotif(`Revision requested on a milestone.`);
    refreshRisk(projId);
  };

  /* ---- Disputes ---- */
  const raiseDispute = async (projId, msId, clientClaim, freelancerResponse) => {
    const proj = projects.find((p) => p.id === projId);
    const m = proj.milestones.find((x) => x.id === msId);
    const disputeId = uid("dsp");
    updateProject(projId, (p) => { p.disputes.push({ id: disputeId, milestoneId: msId, clientClaim, freelancerResponse, status: "Open", loading: true }); return p; });
    const prompt = `You are the AI dispute assistant for EscrowX, a Web3 escrow platform. Review this milestone dispute and return ONLY JSON:
{"summary": "<one sentence neutral summary of the disagreement>", "recommendation": "<a specific, non-binding recommendation, e.g. what % of payment to release and what should happen next>"}
Agreement excerpt / milestone requirement: "${m.description}"
Client claim: "${clientClaim}"
Freelancer response: "${freelancerResponse}"
Freelancer's submitted evidence: "${m.deliverable ? m.deliverable.content : "none provided"}"
Be balanced and specific. Remember: you only recommend, you never make the final financial decision.`;
    const result = await callClaude(prompt, { json: true });
    const out = result || { summary: "The client and freelancer disagree on whether the milestone requirement was fully met.", recommendation: "Partial completion appears likely. Recommend one revision round before releasing 70% of the milestone payment." };
    updateProject(projId, (p) => {
      const d = p.disputes.find((x) => x.id === disputeId);
      d.aiSummary = out.summary; d.aiRecommendation = out.recommendation; d.loading = false;
      logActivity(p, `Dispute raised on "${m.name}". AI recommendation: ${out.recommendation}`);
      return p;
    });
    pushNotif(`AI dispute analysis ready for review.`);
    refreshRisk(projId);
  };

  const resolveDispute = (projId, disputeId, releaseFull) => {
    updateProject(projId, (p) => {
      const d = p.disputes.find((x) => x.id === disputeId);
      d.status = "Resolved";
      const m = p.milestones.find((x) => x.id === d.milestoneId);
      if (releaseFull) {
        m.status = "Paid"; m.paymentStatus = "Released"; m.paidAt = nowStamp(); m.paidAtDate = new Date();
        addTx(p, "Dispute Resolved", m.amount);
        addTx(p, "Payment Released", m.amount);
      } else {
        m.status = "Revision Required";
        addTx(p, "Dispute Resolved", 0);
      }
      logActivity(p, `Dispute resolved for "${m.name}".`);
      return p;
    });
    pushNotif(`Dispute resolved.`);
    if (releaseFull) showToast(`✓ Payment released — funds sent to freelancer`);
    refreshRisk(projId);
  };

  /* ---- Nav ---- */
  const openProject = (id) => { setCurrentProjectId(id); setView("project"); };

  // Wait for the saved-session check to finish before showing anything, so a
  // returning logged-in user doesn't flash the landing page first.

  if (screen === "landing") return <Landing onDemo={enterDemo} />;

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: FONT_BODY }}>
      <FontLoader />
      {demoMode && (
        <div style={{ background: "linear-gradient(90deg, rgba(201,162,39,.16), rgba(201,162,39,.06))", borderBottom: `1px solid rgba(201,162,39,.3)`, textAlign: "center", padding: "6px 10px", fontSize: 12, color: C.goldSoft, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          <Sparkles size={12} /> Demo Mode — sample project loaded, all transactions below are simulated
        </div>
      )}
      <Navbar role={role} setRole={setRole} wallet={wallet} onConnect={connectWallet} notifications={notifications} view={view} setView={setView} onOpenAssistant={() => setShowAssistant(true)} unread={unread} onViewNotifications={() => setUnread(0)} onBackToLogin={logout} profile={profile} />
      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "24px 20px 80px" }}>
        {view === "client" && (
          <ClientDashboard projects={projects} onOpen={openProject} onCreate={() => setShowCreate(true)} wallet={wallet} />
        )}
        {view === "freelancer" && (
          <FreelancerDashboard projects={projects} onOpen={openProject} onRespond={respondToAssignment} />
        )}
        {view === "transactions" && <TransactionsView projects={projects} />}
        {view === "project" && currentProject && (
          <ProjectDetail
            project={currentProject} role={role}
            onAcceptAssignment={() => respondToAssignment(currentProject.id, true)}
            onDeclineAssignment={() => respondToAssignment(currentProject.id, false)}
            onGenerateAgreement={() => generateAgreement(currentProject.id)}
            onDeposit={() => depositEscrow(currentProject.id)}
            onSubmitDeliverable={(msId, d) => submitDeliverable(currentProject.id, msId, d)}
            onAnalyze={(msId) => analyzeDeliverable(currentProject.id, msId)}
            onApprove={(msId) => approveMilestone(currentProject.id, msId)}
            onRevision={(msId) => requestRevision(currentProject.id, msId)}
            onDispute={(msId, c, f) => raiseDispute(currentProject.id, msId, c, f)}
            onResolveDispute={(dId, full) => resolveDispute(currentProject.id, dId, full)}
            onBack={() => setView(role)}
          />
        )}
      </div>
      {showCreate && (
        <CreateProjectModal
          onClose={() => setShowCreate(false)}
          onCreate={async (data) => { const id = await createProject(data); setShowCreate(false); setView("project"); }}
        />
      )}
      {showAssistant && <AssistantPanel project={currentProject} onClose={() => setShowAssistant(false)} />}
      {toast && (
        <div className="fade-up" style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: C.surface2, border: `1px solid rgba(63,191,143,.4)`, color: C.text, borderRadius: 12, padding: "12px 20px", fontSize: 13.5, fontWeight: 600, boxShadow: "0 10px 30px rgba(0,0,0,.4)", zIndex: 200, display: "flex", alignItems: "center", gap: 8 }}>
          <CheckCircle2 size={16} color={C.green} /> {toast.text}
        </div>
      )}
    </div>
  );
}

/* ============================== CREATE PROJECT MODAL ============================== */
function CreateProjectModal({ onClose, onCreate }) {
  const [step, setStep] = useState(1);
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [freelancer, setFreelancer] = useState("");
  const [deadline, setDeadline] = useState("");
  const [milestones, setMilestones] = useState([{ name: "", description: "", amount: "", deadline: "" }]);
  const [refundRules, setRefundRules] = useState(["Missed deadline by 3+ days → 20% partial refund on that milestone", "Cancelled before work begins → full refund"]);
  const [busy, setBusy] = useState(false);

  const allRules = [
    "Missed deadline by 3+ days → 20% partial refund on that milestone",
    "Cancelled before work begins → full refund",
    "Rejected after maximum revisions → eligible for dispute",
    "Mutual cancellation → refund remaining escrow balance",
  ];

  const updateMs = (i, field, val) => setMilestones((ms) => ms.map((m, idx) => (idx === i ? { ...m, [field]: val } : m)));
  const addMs = () => setMilestones((ms) => [...ms, { name: "", description: "", amount: "", deadline: "" }]);
  const removeMs = (i) => setMilestones((ms) => ms.filter((_, idx) => idx !== i));
  const total = milestones.reduce((s, m) => s + Number(m.amount || 0), 0);

  /* ---- Date validation: deadlines must be today or later, and within 12 months ----
     `min`/`max` on the input stop the picker offering past or too-far-out dates, but
     a date can still be typed by hand, so every date is re-checked here and the step
     is blocked with a plain-language message until it's fixed. */
  const TODAY = todayISO();
  const MAX_DEADLINE = maxDeadlineISO();
  const deadlineIsPast = isPastDate(deadline);
  const deadlineIsTooFar = isTooFarDate(deadline);
  const pastMilestones = milestones
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => isPastDate(m.deadline));
  const tooFarMilestones = milestones
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => isTooFarDate(m.deadline));
  const lateMilestones = milestones
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => m.deadline && deadline && m.deadline > deadline);
  const datesValid = !deadlineIsPast && !deadlineIsTooFar && pastMilestones.length === 0 && tooFarMilestones.length === 0;
  const dateErrors = [];
  if (deadlineIsPast) dateErrors.push(`The project deadline (${prettyDate(deadline)}) is in the past. Please choose today or a future date.`);
  if (deadlineIsTooFar) dateErrors.push(`The project deadline (${prettyDate(deadline)}) is more than 12 months out. Please choose a date up to ${prettyDate(MAX_DEADLINE)}.`);
  pastMilestones.forEach(({ m, i }) => dateErrors.push(`Milestone ${i + 1}${m.name ? ` — "${m.name}"` : ""} is due ${prettyDate(m.deadline)}, which is in the past. Please choose a future date.`));
  tooFarMilestones.forEach(({ m, i }) => dateErrors.push(`Milestone ${i + 1}${m.name ? ` — "${m.name}"` : ""} is due ${prettyDate(m.deadline)}, which is more than 12 months out. Please choose a date up to ${prettyDate(MAX_DEADLINE)}.`));

  const dateInputStyle = (bad) => (bad ? { ...inputStyle, borderColor: C.red } : inputStyle);

  const valid = title && freelancer && deadline && milestones.every((m) => m.name && m.amount) && datesValid;

  return (
    <Modal title="Create Escrow Project" onClose={onClose} width={640}>
      {step === 1 && (
        <div>
          <Field label="Project Title"><input style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Website Development" /></Field>
          <Field label="Description"><textarea style={{ ...inputStyle, minHeight: 70, resize: "vertical" }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What does this project involve?" /></Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label="Freelancer"><input style={inputStyle} value={freelancer} onChange={(e) => setFreelancer(e.target.value)} placeholder="e.g. Sarah Chen" /></Field>
            <Field label="Deadline"><input type="date" style={dateInputStyle(deadlineIsPast || deadlineIsTooFar)} value={deadline} min={TODAY} max={MAX_DEADLINE} onWheel={(e) => e.target.blur()} onChange={(e) => setDeadline(e.target.value)} /></Field>
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "16px 0 8px" }}>
            <div style={{ fontSize: 12, color: C.muted, fontWeight: 600 }}>Milestones</div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.gold }}>Total: {money(total)}</div>
          </div>
          {milestones.map((m, i) => (
            <div key={i} style={{ background: C.bgAlt, border: `1px solid ${C.borderSoft}`, borderRadius: 10, padding: 12, marginBottom: 8 }}>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input style={{ ...inputStyle, flex: 2 }} placeholder="Milestone name" value={m.name} onChange={(e) => updateMs(i, "name", e.target.value)} />
                {/* onWheel blur: without it, scrolling the page while this field has
                    focus silently increments/decrements the amount (300 -> 299). */}
                <input style={{ ...inputStyle, flex: 1 }} type="number" min="0" step="any" placeholder="$ amount" value={m.amount} onWheel={(e) => e.target.blur()} onChange={(e) => updateMs(i, "amount", e.target.value)} />
                {milestones.length > 1 && <button onClick={() => removeMs(i)} style={{ background: "none", border: "none", color: C.faint }}><Trash2 size={15} /></button>}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input style={{ ...inputStyle, flex: 2 }} placeholder="What must be delivered for this milestone?" value={m.description} onChange={(e) => updateMs(i, "description", e.target.value)} />
                <input style={{ ...dateInputStyle(isPastDate(m.deadline) || isTooFarDate(m.deadline)), flex: 1 }} type="date" value={m.deadline} min={TODAY} max={MAX_DEADLINE} onWheel={(e) => e.target.blur()} onChange={(e) => updateMs(i, "deadline", e.target.value)} />
              </div>
            </div>
          ))}
          <Btn variant="subtle" size="sm" onClick={addMs}><Plus size={13} /> Add Milestone</Btn>

          <div style={{ margin: "18px 0 8px", fontSize: 12, color: C.muted, fontWeight: 600 }}>Smart Refund Rules</div>
          {allRules.map((r) => (
            <label key={r} style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 12.5, color: C.muted, marginBottom: 6, cursor: "pointer" }}>
              <input type="checkbox" checked={refundRules.includes(r)} onChange={(e) => setRefundRules((rr) => e.target.checked ? [...rr, r] : rr.filter((x) => x !== r))} style={{ marginTop: 2 }} />
              {r}
            </label>
          ))}

          {dateErrors.length > 0 && (
            <div style={{ marginTop: 16, background: "rgba(232,97,91,.08)", border: `1px solid rgba(232,97,91,.35)`, borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, color: C.red, fontWeight: 700, fontSize: 12.5, marginBottom: dateErrors.length ? 6 : 0 }}>
                <AlertTriangle size={13} /> Please pick a valid date
              </div>
              {dateErrors.map((msg, i) => (
                <div key={i} style={{ color: C.muted, fontSize: 12.5, lineHeight: 1.5 }}>• {msg}</div>
              ))}
            </div>
          )}
          {dateErrors.length === 0 && lateMilestones.length > 0 && (
            <div style={{ marginTop: 16, background: "rgba(201,162,39,.07)", border: `1px solid rgba(201,162,39,.3)`, borderRadius: 10, padding: "10px 12px", color: C.goldSoft, fontSize: 12.5, lineHeight: 1.5 }}>
              <strong>Heads up:</strong> {lateMilestones.length === 1 ? "a milestone is" : `${lateMilestones.length} milestones are`} due after the project deadline ({prettyDate(deadline)}). You can still continue — the risk assessment will flag it.
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 18 }}>
            <Btn disabled={!valid} onClick={() => setStep(2)}>Continue <ArrowRight size={14} /></Btn>
          </div>
        </div>
      )}
      {step === 2 && (
        <div>
          <p style={{ color: C.muted, fontSize: 13, marginBottom: 16 }}>Review your project, then EscrowX will use AI to draft a structured smart agreement for both parties to accept.</p>
          <Card style={{ background: C.bgAlt, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 4, color: C.text }}>{title}</div>
            <div style={{ color: C.muted, fontSize: 12.5, marginBottom: 10 }}>{description}</div>
            <div style={{ fontSize: 12.5, color: C.muted }}>Freelancer: {freelancer} · Deadline: {deadline}</div>
            <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 4 }}>
              {milestones.map((m, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: C.text }}><span>{i + 1}. {m.name}</span><span style={{ fontFamily: FONT_MONO }}>{money(m.amount)}</span></div>)}
            </div>
            <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 10, paddingTop: 8, display: "flex", justifyContent: "space-between", fontWeight: 700, color: C.text }}><span>Total</span><span>{money(total)}</span></div>
          </Card>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <Btn variant="ghost" onClick={() => setStep(1)}>Back</Btn>
            <Btn disabled={busy} onClick={async () => { setBusy(true); await onCreate({ title, description, freelancer, deadline, milestones, refundRules }); }}>
              {busy ? <><Loader2 size={14} className="spin" /> Creating…</> : <>Generate Smart Agreement with AI <Sparkles size={14} /></>}
            </Btn>
          </div>
        </div>
      )}
    </Modal>
  );
}
